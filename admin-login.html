<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Seedwel Investment LTD</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --dark: #1a1a2e;
            --gray: #6b7280;
        }

        .login-container {
            max-width: 450px;
            width: 90%;
            margin: 20px;
        }

        .login-card {
            background: white;
            border-radius: 30px;
            padding: 45px 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
            border: 1px solid #e5e7eb;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-img {
            height: 60px;
            margin-bottom: 15px;
        }

        .logo h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--dark);
        }

        .logo p {
            color: var(--gray);
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .admin-badge {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.7rem;
            display: inline-block;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .form-group label i {
            color: var(--primary);
            margin-right: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.85rem;
            display: none;
        }

        .back-link {
            text-align: center;
            margin-top: 25px;
        }

        .back-link a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .security-note {
            text-align: center;
            margin-top: 20px;
            font-size: 0.7rem;
            color: var(--gray);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <img src="https://i.ibb.co/svxj52ny/seedwel.png" alt="Seedwel Investment" class="logo-img">
                <h1>SEEDWEL INVESTMENT</h1>
                <p>Administrator Portal</p>
            </div>

            <div style="text-align: center;">
                <span class="admin-badge"><i class="fas fa-shield-alt"></i> Secure Admin Access</span>
            </div>

            <div id="errorMessage" class="error-message">
                <i class="fas fa-exclamation-circle"></i> Invalid credentials. Please try again.
            </div>

            <form id="adminLoginForm">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Admin Email</label>
                    <input type="email" id="adminEmail" placeholder="admin@seedwel.com" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Login to Dashboard
                </button>
            </form>

            <div class="back-link">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Homepage</a>
            </div>

            <div class="security-note">
                <i class="fas fa-lock"></i> This is a secure administrative area
            </div>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA-BpRy-RVc2rqIG6uiRu_XrGEu1ZGnQwU",
            authDomain: "seedwel-investment-limited.firebaseapp.com",
            databaseURL: "https://seedwel-investment-limited-default-rtdb.firebaseio.com",
            projectId: "seedwel-investment-limited",
            storageBucket: "seedwel-investment-limited.firebasestorage.app",
            messagingSenderId: "197778268619",
            appId: "1:197778268619:web:92f29d88fa5a22dbfa964e"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // List of authorized admin emails
        const authorizedAdmins = [
            "zacheussimbaya@gmail.com",
            "admin@seedwel.com",
            "seedwelinvestmentltd@gmail.com"
        ];

        const form = document.getElementById('adminLoginForm');
        const errorDiv = document.getElementById('errorMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';

            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            // Check if email is authorized
            if (!authorizedAdmins.includes(email)) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Unauthorized access. You do not have admin privileges.';
                return;
            }

            try {
                // Sign in with Firebase
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Store admin session
                localStorage.setItem('adminLoggedIn', 'true');
                localStorage.setItem('adminEmail', email);

                // Redirect to admin dashboard
                window.location.href = 'admin-dashboard.html';
            } catch (error) {
                errorDiv.style.display = 'block';
                if (error.code === 'auth/user-not-found') {
                    errorDiv.textContent = 'Admin account not found. Please contact system administrator.';
                } else if (error.code === 'auth/wrong-password') {
                    errorDiv.textContent = 'Incorrect password. Please try again.';
                } else {
                    errorDiv.textContent = 'Login failed: ' + error.message;
                }
            }
        });

        // Check if already logged in
        if (localStorage.getItem('adminLoggedIn') === 'true') {
            window.location.href = 'admin-dashboard.html';
        }
    </script>
</body>
</html>
